[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Klaus-proxy-local"
version = "0.3.0"
description = "HTTP proxy and toolkit for the Anthropic API"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
keywords = ["anthropic", "claude", "proxy", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "anthropic>=1.0",
    "mitmproxy>=11.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Linters/formateadores fijados: black e isort/ruff cambian de estilo
    # estable entre versiones (p. ej. black 25→26), y un rango flotante hace
    # que `black --check` en CI reformatee código ya formateado con otra
    # versión. Pinear garantiza un formato reproducible local == CI.
    "ruff==0.16.5",
    "black==25.11.0",
]

[project.scripts]
Klaus-proxy = "Klaus_proxy_local.main:main"
claude-proxy = "Klaus_proxy_local.launcher:main"
klaus-install-wrappers = "Klaus_proxy_local.install_wrappers:main"
klaus-setup = "Klaus_proxy_local.setup_shell:main"
klaus-scan = "Klaus_proxy_local.scan:main"
klaus-install-python = "Klaus_proxy_local.install_python:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

# Include wrapper scripts and other data files
[tool.setuptools.package-data]
Klaus_proxy_local = []  # No package data; scripts are at root level

[tool.ruff]
target-version = "py313"
line-length = 88
# Los addons/CLIs viven sueltos en src/ (no como paquete); declararlo como raíz
# de fuentes hace que isort los trate como first-party y no los mezcle con
# dependencias de terceros.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py313"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
