[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Klaus-proxy-local"
version = "0.5.1"
description = "HTTP proxy and toolkit for the Anthropic API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["anthropic", "claude", "proxy", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "anthropic",
    "mitmproxy>=11.0.2",
]

[project.urls]
Homepage = "https://github.com/Ka0s-Klaus/klaus-proxy-local"
Repository = "https://github.com/Ka0s-Klaus/klaus-proxy-local"
Documentation = "https://github.com/Ka0s-Klaus/klaus-proxy-local/tree/main/docs"
"Bug Tracker" = "https://github.com/Ka0s-Klaus/klaus-proxy-local/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    # Linters/formateadores fijados: black e isort/ruff cambian de estilo
    # estable entre versiones (p. ej. black 25→26), y un rango flotante hace
    # que `black --check` en CI reformatee código ya formateado con otra
    # versión. Pinear garantiza un formato reproducible local == CI.
    "ruff>=0.8.0,<1.0.0",
    "black==25.11.0",
]

[project.scripts]
Klaus-proxy = "Klaus_proxy_local.main:main"
claude-proxy = "Klaus_proxy_local.launcher:main"
klaus-install-wrappers = "Klaus_proxy_local.install_wrappers:main"
klaus-setup = "Klaus_proxy_local.setup_shell:main"
klaus-scan = "Klaus_proxy_local.scan:main"
klaus-install-python = "Klaus_proxy_local.install_python:main"
klaus-audit-payloads = "Klaus_proxy_local.audit_all_payloads:main"
klaus-fix-pseudonymization = "Klaus_proxy_local.fix_pseudonymization:main"
klaus-audit-dashboard = "Klaus_proxy_local.audit_dashboard:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
Klaus_proxy_local = []  # No package data; scripts are at root level

[tool.ruff]
target-version = "py39"
line-length = 88
# Los addons/CLIs viven sueltos en src/ (no como paquete); declararlo como raíz
# de fuentes hace que isort los trate como first-party y no los mezcle con
# dependencias de terceros.
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.black]
line-length = 88
target-version = ["py39"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --tb=short"
