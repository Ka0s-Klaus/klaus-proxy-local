version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Solo ignorar patches de herramientas de desarrollo — los patches de deps
      # de producción (httpx, fastapi, anthropic, uvicorn) fluyen automáticamente
      # porque pueden contener fixes de seguridad críticos (OWASP A06).
      - dependency-name: "ruff"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "black"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest"
        update-types: ["version-update:semver-patch"]
      - dependency-name: "pytest-cov"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "08:00"
      timezone: "Europe/Madrid"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
